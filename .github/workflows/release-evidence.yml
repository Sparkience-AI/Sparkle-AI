name: Source release evidence

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate and build source artifacts
        shell: pwsh
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --locked --all-extras pytest -q
          uv build --no-sources
          uv run --locked python scripts/release_evidence.py --dist dist --output dist/evidence --project sparkle-ai --version 0.1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkle-ai-source-release-evidence
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/evidence/*
          if-no-files-found: error
