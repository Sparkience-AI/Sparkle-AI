name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    uses: Sparkience-AI/.github/.github/workflows/reusable-python-quality.yml@adc5b60771b32fbf93f28304fbcf2dd5ad4a0464
    with:
      python-version: "3.12"
      run-type-check: false

  windows-source-validation:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Test Windows desktop behavior
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --locked --all-extras pytest -q
      - name: Build source and wheel distributions
        run: uv build --no-sources
      - name: Smoke-test installed wheel
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          .wheel-smoke/Scripts/python -m pip install --disable-pip-version-check $wheel.FullName
          .wheel-smoke/Scripts/sparkle-ai --version
